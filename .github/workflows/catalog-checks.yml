name: Catalog placeholders
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Static placeholder check
        run: python3 scripts/check-translations.py
      - name: Exported source checksums
        run: python3 scripts/check-source.py
      - name: Catalog and read-only report regression tests
        run: python3 -m unittest discover -s tests
